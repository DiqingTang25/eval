# 使用火山引擎 MySQL RDS，无需本地数据库
# 仅保留应用服务

services:
  app:
    build: .
    container_name: agent_eval_app
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
