# ================================================================
# AI Agent 评测系统 — 生产环境 Docker Compose
# 启动: docker-compose -f deploy/docker-compose.prod.yml up -d
# 注意: 需要先在项目根目录创建 .env (参考 deploy/.env.production)
# ================================================================

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: agent_eval_app
    ports:
      - "127.0.0.1:8000:8000"  # 仅本地回环，通过 nginx 暴露
    env_file:
      - ../.env
    restart: unless-stopped
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    # 日志
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    # 内存限制
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M
