# ================================================================
# Agent Eval 测评系统 — Nginx 反向代理配置 (参考)
#
# ⚠️ 注意: 云端实际 Nginx 配置是巨型单体文件 (/etc/nginx/sites-enabled/aix),
#   同时服务被测平台 (personalized-secure) 和测评系统 (/test/)。
#   此文件仅提取 agent-eval 相关的 /test/ location 块作为参考。
#
# 部署: 将 /test/ location 块合并到你的主 Nginx 配置中。
#   不要直接替换整个配置文件!
# ================================================================

# ── Agent Eval 测评系统路由 ──
# 前端自动检测 /test/ 前缀 (frontend/js/app.js:4)
# 所有请求 /test/* → Nginx 剥离前缀 → proxy 到 uvicorn :8000
location /test/ {
    proxy_pass http://127.0.0.1:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 60s;
    proxy_read_timeout 60s;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
}
