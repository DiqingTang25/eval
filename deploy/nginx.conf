# ===============================================================
# AI Agent 评测系统 — Nginx 反向代理配置
# 部署路径: /etc/nginx/sites-available/agent-eval
# ===============================================================

upstream app_backend {
    # FastAPI + uvicorn
    server 127.0.0.1:8000;
    keepalive 64;
}

# ── HTTP → HTTPS 重定向 ──
server {
    listen 80;
    server_name YOUR_DOMAIN_OR_IP;
    return 301 https://$host$request_uri;
}

# ── HTTPS 主服务 ──
server {
    listen 443 ssl http2;
    server_name YOUR_DOMAIN_OR_IP;

    # SSL 证书 (使用火山引擎证书管理或 Let's Encrypt)
    ssl_certificate     /etc/ssl/certs/agent-eval.crt;
    ssl_certificate_key /etc/ssl/private/agent-eval.key;

    # 现代 SSL 配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全头部
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # 日志
    access_log /var/log/nginx/agent-eval-access.log;
    error_log  /var/log/nginx/agent-eval-error.log;

    # 上传大小限制
    client_max_body_size 10M;

    # ── 静态资源 (前端 SPA) ──
    # 如果 nginx 直接提供静态文件 (推荐，不经过 Python):
    # root /app/frontend;
    # location / {
    #     try_files $uri $uri/ /index.html;
    # }
    # location /static/ {
    #     alias /app/frontend/;
    # }

    # ── API 路由 ──
    location /api/ {
        proxy_pass http://app_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;  # 评测可能长耗时
        proxy_connect_timeout 30s;
    }

    # ── WebSocket ──
    location /ws {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;  # WebSocket 长连接
    }

    # ── 健康检查 ──
    location /health {
        proxy_pass http://app_backend;
        proxy_set_header Host $host;
    }

    # ── SPA 回退 (所有其他路径 → index.html) ──
    location / {
        proxy_pass http://app_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
