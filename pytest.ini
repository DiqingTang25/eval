[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 默认: 跑快速规则层测试（不依赖浏览器/LLM）
# 本地全量: pytest tests/ -m "browser or llm"
# CI快速:  pytest tests/ -m "not browser and not llm"
addopts =
    -v
    --tb=short
    --strict-markers
    -m "not browser and not llm"

markers =
    fast: fast deterministic tests (no browser/LLM, <1s)
    browser: tests requiring a real browser (Playwright)
    slow: slow integration tests
    llm: tests requiring LLM API calls (DeepSeek)

# 超时设置（秒）
timeout = 60

# 过滤警告
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
